<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C-Store</title>
<meta name="theme-color" content="#1f6feb">
<style>
:root{--c:#1f6feb;--c2:#e8f0fe;--bg:#f4f5f7;--card:#fff;--tx:#1f2328;--mut:#6b7280;--line:#e5e7eb;--ok:#15803d;--warn:#b45309;--bad:#b42318;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}
.hd{position:sticky;top:0;z-index:20;background:var(--c);color:#fff;padding:10px 12px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hd-top{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#fff center/cover no-repeat;flex:0 0 auto}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:19px;display:grid;place-items:center}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--c)}
.badge:empty{display:none}
.search{margin-top:9px;display:flex;background:#fff;border-radius:11px;overflow:hidden}
.search input{flex:1;border:0;outline:0;padding:10px 12px;color:var(--tx);background:transparent;min-width:0}
.search button{padding:0 12px;color:var(--mut);font-size:18px}
.ann{background:#fff8e1;color:#7a4b00;font-size:13px;padding:8px 12px;text-align:center}
.ann:empty{display:none}
.wrap{max-width:980px;margin:0 auto;padding:10px 10px 110px}
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}
.banners::-webkit-scrollbar{display:none}
.banners a{flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r);overflow:hidden;aspect-ratio:2.4/1;background:#dde3ea center/cover no-repeat}
@media(min-width:700px){.banners a{flex-basis:70%}}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.chips.sub .chip{padding:5px 11px;font-size:12.5px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px}
.sec h2{font-size:16px;margin:0}
.sec span{font-size:12.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative}
.ph{aspect-ratio:1;background:#eef1f4;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:#b8c0cc}
.card .bd{padding:8px 9px 9px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.sk{font-size:11px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.pr{font-weight:800;color:var(--c);font-size:16px}
.stk{font-size:11.5px;color:var(--mut)}
.stk.low{color:var(--warn);font-weight:700}.stk.out{color:var(--bad);font-weight:700}
.add{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.add:disabled{background:#cbd2db}
.qbox{display:flex;align-items:center;border:1.5px solid var(--c);border-radius:10px;overflow:hidden;flex:0 0 auto}
.qbox button{width:30px;height:31px;color:var(--c);font-size:18px;font-weight:700}
.qbox span{min-width:24px;text-align:center;font-weight:700}
.more{text-align:center;color:var(--mut);padding:16px;font-size:13px}
.hrow{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -10px 12px;padding:0 10px 4px}.hrow::-webkit-scrollbar{display:none}.hrow .card{flex:0 0 42%;max-width:200px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.foot{margin-top:22px;background:#fff;border-radius:var(--r);padding:14px;font-size:13.5px;color:var(--mut)}
.foot b{color:var(--tx)}
.cartbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:25;max-width:960px;margin:0 auto;background:var(--c);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:700}
.cartbar[hidden]{display:none}
.cartbar .t{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet[hidden]{display:none}
.sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh-h h3{flex:1;margin:0;font-size:17px}
.x{width:34px;height:34px;border-radius:10px;background:#f1f3f5;font-size:16px}
.big{width:100%;aspect-ratio:1;max-height:52vh;object-fit:contain;background:#f1f3f5;border-radius:12px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:16px;text-align:center}
.btn.sec2{background:var(--c2);color:var(--c)}
.btn:disabled{opacity:.5}
.ln{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.ln img,.ln .ini2{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#eef1f4;flex:0 0 auto}
.ln .ini2{display:grid;place-items:center;color:#b8c0cc;font-weight:800}
.ln .m{flex:1;min-width:0;font-size:13.5px}
.ln .m small{color:var(--mut)}
.seg{display:flex;gap:8px;margin:6px 0 10px}
.seg label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--c);background:var(--c2);color:var(--c);font-weight:700}
.seg label.dis{opacity:.4;pointer-events:none}
.fld{display:block;margin:7px 0}
.fld span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;outline:0;background:#fff}
.fld input:focus,.fld textarea:focus{border-color:var(--c)}
.sum{background:#f8fafc;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .tot{font-size:18px;font-weight:800;color:var(--c);border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.note{font-size:12.5px;color:var(--mut);margin:6px 0}
.err{color:var(--bad);font-weight:700;font-size:13.5px;margin:8px 0}
.qr{background:#fff;border:2px solid var(--c);border-radius:14px;padding:12px;text-align:center;margin:10px 0}
.qr svg{width:220px;max-width:100%;height:auto;margin:6px auto}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2ff;color:#3730a3}
.st.done{background:#dcfce7;color:#166534}.st.cancel{background:#fee2e2;color:#991b1b}.st.packed{background:#fef3c7;color:#92400e}
.ocard{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:13.5px}
.imgs{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.imgs img{height:90px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#1f2328;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.fly{position:fixed;z-index:70;width:44px;height:44px;border-radius:12px;background:var(--c) center/cover;pointer-events:none;transition:transform .55s cubic-bezier(.5,-.3,.7,1),opacity .55s}
.load{padding:50px 10px;text-align:center;color:var(--mut)}
.prev{background:#fde68a;color:#78350f;text-align:center;font-size:12px;padding:4px}
</style>
</head>
<body>
<div id="prevBar" class="prev" hidden>👁 โหมดดูตัวอย่าง (ยังไม่บันทึก)</div>
<header class="hd">
  <div class="hd-top">
    <div class="logo" id="logo"></div>
    <div class="brand"><b id="sName">C-Store</b><span id="sTag"></span></div>
    <button class="icon-btn" id="ordBtn" title="คำสั่งซื้อของฉัน">🧾</button>
    <button class="icon-btn" id="cartBtn" title="ตะกร้า">🛒<span class="badge" id="cartN"></span></button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="ค้นหาสินค้า ชื่อ / รหัส / รุ่น" autocomplete="off"><button id="qx" aria-label="ล้าง">✕</button></div>
</header>
<div class="ann" id="ann"></div>
<main class="wrap">
  <div class="banners" id="banners"></div>
  <div class="chips" id="cats"></div>
  <div class="chips sub" id="subs"></div>
  <div id="feat"></div>
  <div class="sec"><h2 id="listT">สินค้าทั้งหมด</h2><span id="listN"></span></div>
  <div class="grid" id="grid"><div class="load">กำลังโหลดสินค้า…</div></div>
  <div class="more" id="more"></div>
  <div class="foot" id="foot"></div>
</main>
<button class="cartbar" id="cartBar" hidden><span>🛒</span><span class="t" id="cbT"></span><span id="cbP"></span></button>
<div class="sheet" id="sheet" hidden><div class="box" id="sbox"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== C-Store หน้าร้านลูกค้า · cs-v1119a =====
 * ใส่ลิงก์ Web app ของ Apps Script (C-Store) ที่นี่ ↓ (ลงท้ายด้วย /exec) */
const CS_API = 'https://script.google.com/macros/s/AKfycbwMV4lEBh4DJDtiCoCkaVEfcz6vxf5WCptzjB2FuHBNKqfYbgJUnAD_yS0kvKwD9dMEIA/exec';
const API = (function () { try { return localStorage.getItem('cs_api') || CS_API; } catch (e) { return CS_API; } })();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const params = new URLSearchParams(location.search), PREVIEW = params.get('preview') === '1';
let CAT = null, ST = {}, BY = {}, cart = LS.get('cs_cart', {}), F = { c1: '', c2: '', q: '' }, LIST = [], shown = 0, PAGE = 40;

/* ---------- ข้อมูล ---------- */
async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j;
}
function useCatalog(c) {
  CAT = c; ST = Object.assign({}, c.store || {});
  if (PREVIEW) { const d = LS.get('cs_preview', null); if (d) ST = Object.assign(ST, d); $('prevBar').hidden = false; }
  BY = {}; c.items.forEach((it, i) => { it.k = i; it.t = (it.s + ' ' + it.n + ' ' + (it.f || '') + ' ' + catName(it.c)).toLowerCase(); BY[it.s] = it; });
  Object.keys(cart).forEach(s => { if (!BY[s]) delete cart[s]; }); saveCart();
  theme(); renderCats(); renderList(); renderFeat(); renderFoot(); cartUi();
}
async function loadCatalog() {
  const cached = LS.get('cs_cat', null);
  if (cached && cached.items) useCatalog(cached);
  try {
    const r = await fetch(API + '?action=catalog', { cache: 'no-store' }), j = await r.json();
    if (!j.ok) throw new Error(j.error);
    if (!cached || cached.at !== j.at || JSON.stringify(cached.store) !== JSON.stringify(j.store)) { LS.set('cs_cat', j); const y = scrollY; useCatalog(j); scrollTo(0, y); }
  } catch (e) { if (!cached) $('grid').innerHTML = '<div class="empty">โหลดสินค้าไม่สำเร็จ<br><small>' + esc(e.message) + '</small><br><br><button class="btn sec2" onclick="location.reload()">ลองใหม่</button></div>'; }
  initLiff();
}
const catName = ci => ci >= 0 && CAT.cats[ci] ? CAT.cats[ci].filter(Boolean).join(' ') : '';
function imgUrl(u) {
  u = String(u || ''); const m = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/.exec(u);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=w600' : u;
}
function imgTag(it, cls) {
  const ini = esc(String(it.n || it.s).replace(/[^\wก-๙]/g, '').slice(0, 2));
  return '<div class="ini">' + ini + '</div>' + (it.i ? '<img loading="lazy" decoding="async" src="' + esc(imgUrl(it.i)) + '" alt="" onerror="this.remove()">' : '');
}

/* ---------- หน้าตาร้าน (ตั้งในหน้าแอดมิน) ---------- */
function theme() {
  const c = /^#[0-9a-f]{6}$/i.test(ST.color || '') ? ST.color : '#1f6feb';
  document.documentElement.style.setProperty('--c', c);
  document.documentElement.style.setProperty('--c2', c + '1a');
  document.querySelector('meta[name=theme-color]').content = c;
  document.title = ST.name || 'C-Store';
  $('sName').textContent = ST.name || 'C-Store'; $('sTag').textContent = ST.tagline || '';
  $('logo').style.backgroundImage = ST.logo ? 'url("' + imgUrl(ST.logo) + '")' : ''; $('logo').hidden = !ST.logo;
  $('ann').textContent = ST.announce || '';
  const B = (ST.banners || []).filter(b => b && b.img);
  $('banners').innerHTML = B.map((b, i) => '<a href="' + esc(b.link || '#') + '" data-bl="' + esc(b.link || '') + '" style="background-image:url(&quot;' + esc(imgUrl(b.img)) + '&quot;)"></a>').join('');
  $('banners').hidden = !B.length;
}
let banT = null;
function bannerAuto() { clearInterval(banT); banT = setInterval(() => { const b = $('banners'); if (!b.children.length || b.matches(':hover')) return; const w = b.children[0].offsetWidth + 10; const nx = b.scrollLeft + w >= b.scrollWidth - 5 ? 0 : b.scrollLeft + w; b.scrollTo({ left: nx, behavior: 'smooth' }); }, 4500); }
$('banners').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; const l = a.dataset.bl;
  if (/^cat:/.test(l)) { e.preventDefault(); F.c1 = l.slice(4); F.c2 = ''; renderCats(); renderList(true); } else if (/^sku:/.test(l)) { e.preventDefault(); openItem(l.slice(4)); } else if (!/^https?:/.test(l)) e.preventDefault(); });
function renderFoot() {
  const p = ST.pickup || {}, s = ST.ship || {};
  $('foot').innerHTML = '<b>🏪 ' + esc(ST.name || '') + '</b>' + (p.addr ? '<div>📍 ' + esc(p.addr) + (p.map ? ' · <a href="' + esc(p.map) + '" target="_blank">แผนที่</a>' : '') + '</div>' : '') +
    (p.hours ? '<div>🕘 ' + esc(p.hours) + '</div>' : '') + (p.phone ? '<div>📞 <a href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a></div>' : '') +
    '<div>🚚 ค่าส่ง ' + fmt(+s.fee || 0) + ' บาท' + (+s.free > 0 ? ' · ซื้อครบ ' + fmt(+s.free) + ' บาท ส่งฟรี' : '') + '</div>' + (ST.footer ? '<div style="margin-top:6px;white-space:pre-line">' + esc(ST.footer) + '</div>' : '');
}

/* ---------- หมวด / ค้นหา / รายการ ---------- */
function renderCats() {
  if (!CAT) return; const c1 = [], seen = {};
  CAT.cats.forEach(p => { if (p[0] && !seen[p[0]]) { seen[p[0]] = 1; c1.push(p[0]); } });
  $('cats').innerHTML = '<button class="chip' + (F.c1 ? '' : ' on') + '" data-c1="">ทั้งหมด</button>' + c1.map(c => '<button class="chip' + (F.c1 === c ? ' on' : '') + '" data-c1="' + esc(c) + '">' + esc(c) + '</button>').join('');
  const c2 = [], s2 = {}; if (F.c1) CAT.cats.forEach(p => { if (p[0] === F.c1 && p[1] && !s2[p[1]]) { s2[p[1]] = 1; c2.push(p[1]); } });
  $('subs').innerHTML = c2.length > 1 ? '<button class="chip' + (F.c2 ? '' : ' on') + '" data-c2="">ทั้งหมดใน ' + esc(F.c1) + '</button>' + c2.map(c => '<button class="chip' + (F.c2 === c ? ' on' : '') + '" data-c2="' + esc(c) + '">' + esc(c) + '</button>').join('') : '';
  $('subs').hidden = !c2.length;
}
$('cats').onclick = e => { const b = e.target.closest('[data-c1]'); if (!b) return; F.c1 = b.dataset.c1; F.c2 = ''; renderCats(); renderList(true); };
$('subs').onclick = e => { const b = e.target.closest('[data-c2]'); if (!b) return; F.c2 = b.dataset.c2; renderCats(); renderList(true); };
let qT = null;
$('q').oninput = () => { clearTimeout(qT); qT = setTimeout(() => { F.q = $('q').value.trim().toLowerCase(); renderList(true); }, 180); };
$('qx').onclick = () => { $('q').value = ''; F.q = ''; renderList(true); };
function filtered() {
  const toks = F.q.split(/\s+/).filter(Boolean);
  let L = CAT.items.filter(it => { const p = CAT.cats[it.c] || []; if (F.c1 && p[0] !== F.c1) return false; if (F.c2 && p[1] !== F.c2) return false; return toks.every(t => it.t.indexOf(t) >= 0); });
  L.sort((a, b) => ((b.o || 0) - (a.o || 0)) || (a.k - b.k));
  return L;
}
function renderList(top) {
  if (!CAT) return; LIST = filtered(); shown = 0; $('grid').innerHTML = '';
  $('listT').textContent = F.q ? 'ผลการค้นหา "' + F.q + '"' : F.c2 || F.c1 || 'สินค้าทั้งหมด';
  $('listN').textContent = LIST.length.toLocaleString() + ' รายการ';
  $('feat').hidden = !!(F.q || F.c1);
  if (!LIST.length) $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">ไม่พบสินค้า</div>';
  more(); if (top) { const g = $('cats').getBoundingClientRect().top + scrollY - 140; if (scrollY > g) scrollTo(0, g); }
}
function more() { const add = LIST.slice(shown, shown + PAGE); shown += add.length; $('grid').insertAdjacentHTML('beforeend', add.map(cardHtml).join('')); $('more').textContent = shown < LIST.length ? 'กำลังโหลดเพิ่ม…' : ''; }
new IntersectionObserver(es => { if (es[0].isIntersecting && CAT && shown < LIST.length) more(); }, { rootMargin: '600px' }).observe($('more'));
function stockTxt(it) { return it.q === null ? '<span class="stk">สอบถามสต็อก</span>' : it.q <= 0 ? '<span class="stk out">สินค้าหมด</span>' : it.q <= 5 ? '<span class="stk low">เหลือ ' + it.q + '</span>' : '<span class="stk">มี ' + it.q + '</span>'; }
function ctrl(it) {
  const n = cart[it.s] || 0, out = it.q !== null && it.q <= 0;
  return n ? '<span class="qbox"><button data-m="' + esc(it.s) + '">−</button><span>' + n + '</span><button data-p="' + esc(it.s) + '">+</button></span>' : '<button class="add" data-p="' + esc(it.s) + '"' + (out ? ' disabled' : '') + ' aria-label="ใส่ตะกร้า">+</button>';
}
function cardHtml(it) {
  return '<div class="card" data-s="' + esc(it.s) + '"><div class="ph">' + imgTag(it) + '</div><div class="bd"><div class="nm">' + esc(it.n) + '</div><div class="sk">' + esc(it.s) + ' · ' + stockTxt(it) + '</div>' +

  const c = e.target.closest('.card'); if (c && !e.target.closest('.sheet')) openItem(c.dataset.s);
});
function setQty(s, n, fromEl) {
  const it = BY[s]; if (!it) return;

  if (n <= 0) delete cart[s]; else cart[s] = n;
  saveCart(); refreshCtl(s); cartUi(); if (fromEl) flyToCart(fromEl, it);
  if (!$('sheet').hidden && sheetMode === 'cart') renderCart();
  if (!$('sheet').hidden && sheetMode === 'item') $('itCtl').innerHTML = ctrl(it);
}
function saveCart() { LS.set('cs_cart', cart); }
function cartCount() { return Object.values(cart).reduce((a, n) => a + n, 0); }
function cartSum() { return Object.keys(cart).reduce((a, s) => a + (BY[s] ? BY[s].p * cart[s] : 0), 0); }
function cartUi() { const n = cartCount(); $('cartN').textContent = n || ''; $('cartBar').hidden = !n; $('cbT').textContent = n + ' ชิ้น · ดูตะกร้า'; $('cbP').textContent = '฿' + fmt(cartSum()); }
function flyToCart(el, it) {
  try { const a = el.getBoundingClientRect(), b = $('cartBtn').getBoundingClientRect(), f = document.createElement('div'); f.className = 'fly';
    if (it.i) f.style.backgroundImage = 'url("' + imgUrl(it.i) + '")'; f.style.left = a.left + 'px'; f.style.top = a.top + 'px'; document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = 'translate(' + (b.left - a.left) + 'px,' + (b.top - a.top) + 'px) scale(.3)'; f.style.opacity = '.3'; });
    setTimeout(() => f.remove(), 600); } catch (e) { }
}
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, ms || 2200); }

$('sheet').onclick = e => { if (e.target === $('sheet') || e.target.closest('.x')) closeSheet(); };

$('cartBtn').onclick = () => openCart(); $('cartBar').onclick = () => openCart();
const form = LS.get('cs_form', { method: 'pickup', pay: 'qr', name: '', phone: '', address: '', note: '' });
function openCart() { openSheet('cart', ''); renderCart(); }
function shipFee(sub) { const s = ST.ship || {}; return form.method === 'ship' ? (+s.free > 0 && sub >= +s.free ? 0 : +s.fee || 0) : 0; }
function renderCart() {
  const L = Object.keys(cart).filter(s => BY[s]);
  if (!L.length) { $('sbox').innerHTML = '<div class="sh-h"><h3>🛒 ตะกร้า</h3><button class="x">✕</button></div><div class="empty">ยังไม่มีสินค้าในตะกร้า</div>'; return; }
  const pay = ST.pay || {}, canStore = pay.store !== false && form.method === 'pickup', canQr = pay.qr !== false && !!ST.ppId;
  if (form.pay === 'store' && !canStore) form.pay = 'qr'; if (form.pay === 'qr' && !canQr && canStore) form.pay = 'store';

    L.map(sk => { const it = BY[sk]; return '<div class="ln">' + (it.i ? '<img src="' + esc(imgUrl(it.i)) + '" alt="">' : '<div class="ini2">' + esc(it.s.slice(0, 2)) + '</div>') + '<div class="m">' + esc(it.n) + '<br><small>' + esc(it.s) + ' · ฿' + fmt(it.p) + '</small><br><b>฿' + fmt(it.p * cart[sk]) + '</b></div>' + ctrl(it) + '</div>'; }).join('') +
    '<div style="font-weight:700;margin-top:12px">รับสินค้า</div><div class="seg"><label><input type="radio" name="mt" value="pickup"' + (form.method === 'pickup' ? ' checked' : '') + '>🏪 รับที่ร้าน</label><label><input type="radio" name="mt" value="ship"' + (form.method === 'ship' ? ' checked' : '') + '>🚚 จัดส่ง ' + (sf || form.method !== 'ship' ? '' : '(ฟรี)') + '</label></div>' +
    (form.method === 'pickup' && p.addr ? '<div class="note">📍 ' + esc(p.addr) + (p.hours ? ' · ' + esc(p.hours) : '') + '</div>' : '') +
    (form.method === 'ship' ? '<div class="note">ค่าส่ง ' + fmt(+s.fee || 0) + ' บาท' + (+s.free > 0 ? ' · ครบ ' + fmt(+s.free) + ' บาท ส่งฟรี' + (sub < +s.free ? ' (อีก ' + fmt(+s.free - sub) + ' บาท)' : ' ✅') : '') + (s.note ? ' · ' + esc(s.note) : '') + '</div>' : '') +
    '<div style="font-weight:700;margin-top:10px">ชำระเงิน</div><div class="seg"><label class="' + (canQr ? '' : 'dis') + '"><input type="radio" name="py" value="qr"' + (form.pay === 'qr' ? ' checked' : '') + '>📱 โอนพร้อมเพย์</label><label class="' + (canStore ? '' : 'dis') + '"><input type="radio" name="py" value="store"' + (form.pay === 'store' ? ' checked' : '') + '>💵 จ่ายที่ร้าน</label></div>' +
    '<label class="fld"><span>ชื่อผู้สั่ง</span><input id="fName" value="' + esc(form.name) + '" autocomplete="name"></label>' +
    '<label class="fld"><span>เบอร์โทร</span><input id="fPhone" value="' + esc(form.phone) + '" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxx"></label>' +
    (form.method === 'ship' ? '<label class="fld"><span>ที่อยู่จัดส่ง (บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์)</span><textarea id="fAddr" rows="3" autocomplete="street-address">' + esc(form.address) + '</textarea></label>' : '') +
    '<label class="fld"><span>หมายเหตุถึงร้าน (ถ้ามี)</span><input id="fNote" value="' + esc(form.note) + '"></label>' +
    '<div class="sum"><div><span>ค่าสินค้า</span><span>฿' + fmt(sub) + '</span></div>' + (form.method === 'ship' ? '<div><span>ค่าส่ง</span><span>' + (sf ? '฿' + fmt(sf) : 'ฟรี') + '</span></div>' : '') + '<div class="tot"><span>รวมทั้งหมด</span><span>฿' + fmt(sub + sf) + '</span></div></div>' +
    (ST.checkoutNote ? '<div class="note" style="white-space:pre-line">' + esc(ST.checkoutNote) + '</div>' : '') +
    '<div class="err" id="cErr"></div><button class="btn" id="goOrder">✅ ยืนยันสั่งซื้อ</button>';
  $('sbox').querySelectorAll('input[name=mt]').forEach(r => r.onchange = () => { keepForm(); form.method = r.value; LS.set('cs_form', form); renderCart(); });
  $('sbox').querySelectorAll('input[name=py]').forEach(r => r.onchange = () => { keepForm(); form.pay = r.value; LS.set('cs_form', form); });
  $('goOrder').onclick = placeOrder;
}
function keepForm() { const v = id => $(id) ? $(id).value : undefined; ['name:fName', 'phone:fPhone', 'address:fAddr', 'note:fNote'].forEach(x => { const [k, id] = x.split(':'); const a = v(id); if (a !== undefined) form[k] = a; }); LS.set('cs_form', form); }
async function placeOrder() {
  keepForm(); const err = t => { $('cErr').textContent = t; };
  if (!form.name.trim()) return err('กรุณาใส่ชื่อ'); if (!/^0\d{8,9}$/.test(form.phone.replace(/\D/g, ''))) return err('กรุณาใส่เบอร์โทรให้ถูกต้อง');
  if (form.method === 'ship' && form.address.trim().length < 10) return err('กรุณาใส่ที่อยู่จัดส่งให้ครบ');
  if (PREVIEW) return err('โหมดดูตัวอย่าง – สั่งซื้อไม่ได้');
  const b = $('goOrder'); b.disabled = true; b.textContent = 'กำลังส่งคำสั่งซื้อ…'; err('');
  try {
    const idToken = await lineToken(); if (!idToken) { b.disabled = false; b.textContent = '✅ ยืนยันสั่งซื้อ'; return; }
    const r = await api({ action: 'order', idToken, items: Object.keys(cart).map(s => ({ s, q: cart[s] })), method: form.method, pay: form.pay, name: form.name, phone: form.phone, address: form.method === 'ship' ? form.address : '', note: form.note });
    cart = {}; saveCart(); cartUi(); document.querySelectorAll('.ctl').forEach(el => { const s = el.closest('.card').dataset.s; el.innerHTML = ctrl(BY[s]); });
    form.note = ''; LS.set('cs_form', form);
    try { if (window.liff && liff.isInClient()) await liff.sendMessages([{ type: 'text', text: r.text.slice(0, 4900) }]); } catch (e) { }   // แจ้งเข้าแชท LINE OA ของร้าน (ฟรี ไม่กินโควตา)
    showDone(r);
  } catch (e) { err(e.message); b.disabled = false; b.textContent = '✅ ยืนยันสั่งซื้อ'; }
}
function showDone(r) {
  openSheet('done', '<div class="sh-h"><h3>✅ สั่งซื้อสำเร็จ</h3><button class="x">✕</button></div><div style="text-align:center"><div class="note">เลขที่คำสั่งซื้อ</div><div style="font-size:24px;font-weight:800">' + esc(r.no) + '</div><div style="font-size:20px;font-weight:800;color:var(--c);margin:6px 0">฿' + fmt(r.total) + '</div></div>' +
    (r.pay === 'qr' ? payBox(r.no, r.total) : '<div class="sum">💵 ชำระเงินที่ร้านตอนมารับของ · ร้านจะแจ้งทาง LINE เมื่อจัดของเสร็จ</div>') +
    '<button class="btn sec2" style="margin-top:10px" onclick="openOrders()">🧾 ดูคำสั่งซื้อของฉัน</button>');
  if (r.pay === 'qr') drawQr(r.total);
}
function payBox(no, total) {
  return '<div class="qr"><b>📱 สแกนจ่ายด้วยพร้อมเพย์</b><div id="qrSvg">กำลังสร้าง QR…</div><div style="font-size:20px;font-weight:800">฿' + fmt(total) + '</div><div class="note">' + esc(ST.ppName || '') + '</div>' +
    '<label class="btn" style="margin-top:8px">📎 แนบสลิปโอนเงิน<input type="file" accept="image/*" hidden onchange="sendSlip(\'' + esc(no) + '\',this)"></label><div id="slipMsg" class="note"></div></div>';
}
function loadQrLib() { return window.QRLib ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'qrlib.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
function ppCrc16(str) { let crc = 0xFFFF; for (let i = 0; i < str.length; i++) { crc ^= str.charCodeAt(i) << 8; for (let b = 0; b < 8; b++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; } return ('000' + crc.toString(16).toUpperCase()).slice(-4); }
function ppTlv(id, val) { return id + ('0' + String(val).length).slice(-2) + val; }
function ppPayload(id, amount) {
  const d = String(id || '').replace(/\D/g, ''); if (!/^\d{10}$/.test(d) && !/^\d{13}$/.test(d)) return '';
  const target = d.length === 13 ? ppTlv('02', d) : ppTlv('01', '0066' + d.slice(1)), amt = Math.round(Number(amount) * 100) / 100;
  const body = ppTlv('00', '01') + ppTlv('01', amt > 0 ? '12' : '11') + ppTlv('29', ppTlv('00', 'A000000677010111') + target) + ppTlv('58', 'TH') + ppTlv('53', '764') + (amt > 0 ? ppTlv('54', amt.toFixed(2)) : '') + '6304';
  return body + ppCrc16(body);
}
async function drawQr(total) {
  try { await loadQrLib(); const pl = ppPayload(ST.ppId, total); if (!pl) throw new Error('ร้านยังไม่ได้ตั้งพร้อมเพย์');
    const q = new window.QRLib.QRCode(-1, window.QRLib.QRErrorCorrectLevel.M); q.addData(pl); q.make();
    const n = q.getModuleCount(), z = n + 8; let path = ''; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) path += 'M' + (c + 4) + ',' + (r + 4) + 'h1v1h-1z';
    $('qrSvg').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + z + ' ' + z + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + path + '"/></svg>';
  } catch (e) { $('qrSvg').textContent = '⚠️ ' + e.message; }
}
function shrink(file, max) {
  return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .85)); }; img.onerror = no; img.src = u; });
}
async function sendSlip(no, inp) {
  const f = inp.files && inp.files[0]; if (!f) return; const m = $('slipMsg') || {}; m.textContent = 'กำลังส่งสลิป…';
  try { const idToken = await lineToken(); if (!idToken) return; const img = await shrink(f, 1400); await api({ action: 'slip', idToken, no, img }); m.textContent = '✅ ส่งสลิปแล้ว ร้านกำลังตรวจสอบ'; toast('ส่งสลิปแล้ว');
    try { if (window.liff && liff.isInClient()) await liff.sendMessages([{ type: 'text', text: '🧾 ส่งสลิปแล้ว ออเดอร์ ' + no }]); } catch (e) { }
    if (sheetMode === 'orders') openOrders();
  } catch (e) { m.textContent = '❌ ' + e.message; }
}
$('ordBtn').onclick = () => openOrders();
async function openOrders() {
  openSheet('orders', '<div class="sh-h"><h3>🧾 คำสั่งซื้อของฉัน</h3><button class="x">✕</button></div><div class="load">กำลังโหลด…</div>');
  try { const idToken = await lineToken(); if (!idToken) return closeSheet(); const r = await api({ action: 'myOrders', idToken });

    $('sbox').innerHTML = '<div class="sh-h"><h3>🧾 คำสั่งซื้อของฉัน</h3><button class="x">✕</button></div>' + (r.orders.length ? r.orders.map(o =>
      '<div class="ocard"><div style="display:flex;justify-content:space-between;gap:6px"><b>' + esc(o.no) + '</b><span class="st ' + esc(o.status) + '">' + esc(o.statusTh) + '</span></div>' +
      '<div class="note">' + esc(o.created.slice(0, 16)) + ' · ' + (o.method === 'ship' ? '🚚 จัดส่ง' : '🏪 รับที่ร้าน') + ' · ' + (o.pay === 'qr' ? 'โอน' : 'จ่ายที่ร้าน') + '</div>' +
      o.items.map(l => l.x ? '<div style="opacity:.6">• <s>' + esc(l.n) + ' ×' + l.q + '</s> <span class="note">ยกเลิก</span></div>' : '<div>• ' + esc(l.n) + ' ×' + l.q + ' <span class="note">฿' + fmt(l.t) + '</span></div>').join('') + '<div style="font-weight:800;margin-top:4px">รวม ฿' + fmt(o.total) + '</div>' +
      (o.track ? '<div>📦 เลขพัสดุ: <b>' + esc(o.track) + '</b></div>' : '') + (o.cancel ? '<div class="err">เหตุผลยกเลิก: ' + esc(o.cancel) + '</div>' : '') +
      (o.packImgs.length ? '<div class="imgs">' + o.packImgs.map(u => '<img src="' + esc(u) + '=w400" alt="" onclick="window.open(\'' + esc(u) + '\')">').join('') + '</div>' : '') +
      (o.pay === 'qr' && (o.status === 'new' || o.status === 'slip') ? '<button class="btn sec2" style="margin-top:8px" onclick="payAgain(\'' + esc(o.no) + '\',' + o.total + ')">' + (o.hasSlip ? '📎 ส่งสลิปใหม่ / ดู QR' : '📱 จ่ายเงิน / แนบสลิป') + '</button>' : '') + '</div>').join('') : '<div class="empty">ยังไม่มีคำสั่งซื้อ</div>');
  } catch (e) { $('sbox').innerHTML = '<div class="sh-h"><h3>🧾 คำสั่งซื้อของฉัน</h3><button class="x">✕</button></div><div class="err">' + esc(e.message) + '</div>'; }
}
function payAgain(no, total) { openSheet('pay', '<div class="sh-h"><h3>ชำระเงิน ' + esc(no) + '</h3><button class="x">✕</button></div>' + payBox(no, total) + '<button class="btn sec2" onclick="openOrders()">← กลับ</button>'); drawQr(total); }

/* ---------- LINE (LIFF) ---------- */
let liffReady = null;
function initLiff() {
  if (liffReady || !ST.liffId) return liffReady;
  liffReady = new Promise(ok => { const s = document.createElement('script'); s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload = () => liff.init({ liffId: ST.liffId }).then(() => ok(true)).catch(() => ok(false)); s.onerror = () => ok(false); document.head.appendChild(s); });
  liffReady.then(ok => { if (ok && params.get('reg')) regAdmin(params.get('reg')); });
  return liffReady;
}
async function lineToken() {
  if (!ST.liffId) throw new Error('ร้านยังไม่ได้ตั้งค่า LINE (LIFF ID)');
  const ok = await initLiff(); if (!ok) throw new Error('เชื่อมต่อ LINE ไม่ได้ – เปิดร้านจากในแอป LINE');
  if (!liff.isLoggedIn()) { toast('กำลังเข้าสู่ระบบ LINE…'); liff.login({ redirectUri: location.href }); return ''; }
  const t = liff.getIDToken(); if (!t) { liff.logout(); liff.login({ redirectUri: location.href }); return ''; }
  try { const d = liff.getDecodedIDToken(); if (d && d.exp * 1000 < Date.now() + 60e3) { liff.logout(); liff.login({ redirectUri: location.href }); return ''; } } catch (e) { }
  return t;
}
async function regAdmin(code) {
  try { const t = await lineToken(); if (!t) return; const r = await api({ action: 'reg', idToken: t, code });
    openSheet('reg', '<div class="sh-h"><h3>🔔 รับแจ้งเตือนออเดอร์</h3><button class="x">✕</button></div><div class="sum">✅ ลงทะเบียน ' + esc(r.name) + ' แล้ว จะได้รับแจ้งเตือนเมื่อมีออเดอร์ใหม่' + (r.warn ? '<br><span class="err">⚠️ ' + esc(r.warn) + '</span>' : '') + '</div>');
    history.replaceState(null, '', location.pathname);
  } catch (e) { toast('❌ ' + e.message, 4000); }
}
