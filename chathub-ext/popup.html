<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>
  body { font-family: system-ui, "Sarabun", sans-serif; width: 300px; margin: 0; padding: 14px; color: #1d2430; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .st { font-size: 13px; line-height: 1.6; background: #f4f6f9; border-radius: 10px; padding: 8px 10px; }
  a.dl { display:block; text-align:center; margin-top:6px; padding:7px; border-radius:8px; background:#e8a400; color:#fff; font-weight:700; text-decoration:none; }
  .ok { color: #1f7a4d; } .err { color: #c0392b; }
  button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; font-weight: 700; cursor: pointer; }
  .sec { font-size:12px; font-weight:800; color:#6b7685; margin:12px 0 4px; letter-spacing:.2px; }
  .row2 { display:flex; gap:6px; } .row2 button { flex:1; }
  body { width: 320px !important; }
  button.g { background: #eef2f7; color: #1d2430; }
</style></head>
<body>
  <h3>🧰 KengAmp ผู้ช่วยร้าน <span id="ver" style="font-weight:400;color:#6b7685;font-size:12px"></span></h3>
  <div id="upd" hidden style="background:#fff4d6;border:1px solid #f0c36d;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;line-height:1.6"></div>
  <div class="sec">💬 แชท (Chat Hub)</div>
  <div class="st" id="st">กำลังโหลด…</div>
  <div class="row2"><button id="now">↻ ดึงแชทตอนนี้</button><button class="g" id="hub">เปิด Chat Hub</button></div>
  <button class="g" id="catNow" title="อ่านรายการสินค้า Shopee / Lazada ให้กล่องค้นหาสินค้าใน Chat Hub (อัตโนมัติวันละครั้ง)">📦 อัปเดตรายการสินค้าตอนนี้</button>
  <div class="sec">🟢 งานเบื้องหลัง (POS · สิ่งที่ต้องเปิด / ทำ)</div>
  <div class="st" id="jobs">กำลังโหลด…</div>
  <div id="jobStep" hidden style="margin:6px 0;padding:6px 10px;border-radius:8px;background:#fff7e6;color:#8a5a00;font-weight:600"></div>
  <button class="g" id="jobsNow">🟢 เช็กงานเบื้องหลังตอนนี้</button>
  <button class="g" id="opt" style="margin-top:12px">⚙ ตั้งค่า</button>
  <script src="popup.js"></script>
</body></html>
